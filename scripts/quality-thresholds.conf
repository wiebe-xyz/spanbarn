# quality-thresholds.conf — the committed thresholds for scripts/quality-gate.sh.
#
# This file is the ONLY place a threshold lives. The gate refuses to run if any
# of these names is also set in the environment, so `COMPLEXITY=99 make
# quality-gate` fails loudly instead of quietly passing. Every change to a
# number here is a line in a pull-request diff that a reviewer can see.
#
# Refresh with `make quality-gate-update`, which is the only escape hatch.
#
# Format: KEY=VALUE, one per line. No shell, no expansion, no comments after a
# value.

# --- Coverage ---------------------------------------------------------------
# Package aggregates for the two gated packages.
COVERAGE_SERVICE_MIN=84.5
COVERAGE_REPOSITORY_MIN=78.2
# Per-file floor: no single source file in the gated packages may sit at or
# under this. Migration DDL and test files are excluded.
MIN_FILE_COVERAGE=57.5
# How far a coverage measurement may sit above its floor before the gate calls
# the floor stale and fails (ratchet property 3).
#
# Why 5.0 and not the estate's 1.0pp slack: the pipeline measures coverage on
# two different Go toolchains and they do not agree. CI run 32776709389 reported
# internal/service at 80.5%; a local `go test -cover` on the same commit reports
# 84.0%. A 1.0pp trigger would flap between "raise the floor" and "coverage
# dropped" with no code changing, and `--update-baseline` run locally would
# write a floor CI cannot meet. So the floors are raised by hand from a CI
# measurement (CI percentage minus 1.0pp) and 5.0 is the alarm that says a gain
# is big enough to be worth locking in.
COVERAGE_STALE_MARGIN=5.0

# --- Cyclomatic complexity --------------------------------------------------
COMPLEXITY=15
# Count of functions over COMPLEXITY. Must equal the measured count exactly:
# more fails as a regression, fewer fails as a stale baseline.
CYCLO_MAX_COUNT=0

# --- File length ------------------------------------------------------------
FILE_LINES=500
FILELEN_MAX_COUNT=0
FILE_HARD_CAP=1200

# --- Duplication ------------------------------------------------------------
DUPL_TOKENS=100
DUPL_MAX_GROUPS=16

# --- Soaks ------------------------------------------------------------------
# report  — run, print the count against the baseline, never fail the build
# enforce — full ratchet, fails on a new violation and on a stale baseline
#
# Boundaries: internal/api must reach persistence through internal/service.
# Baseline is empty (scripts/boundaries-baseline.txt).
# Enforced: a new api->repository import fails the gate.
BOUNDARIES_MODE=enforce
# Infra: every kustomize overlay renders and the render satisfies the assertions
# in scripts/infracheck. Baseline in scripts/infra-baseline.txt.
# Enforce at 0 baselined findings.
INFRA_MODE=report

# Depguard (.golangci.yml): live and blocking in `make lint` and CI. One
# baselined exclusion remains: internal/api/setup.go imports database/sql only
# for sql.ErrNoRows from repository.GetProjectBySlug, which leaks a raw DB error
# past the storage layer. Exit criterion: GetProjectBySlug returns a repository
# error value, setup.go uses it, and the `exclusions` block in .golangci.yml is
# deleted (target 0 exclusions). A new exclusion is a regression.
