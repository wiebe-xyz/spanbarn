openapi: 3.1.0
info:
  title: SpanBarn Ingest API
  version: 0.1.0
  description: Span ingestion endpoints for SpanBarn telemetry aggregator

servers:
  - url: http://localhost:8080

paths:
  /api/v1/spans:
    post:
      summary: Ingest spans (native JSON format)
      operationId: ingestSpans
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpanBatch'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
        '400':
          description: Invalid payload
        '401':
          description: Missing or invalid API key
        '413':
          description: Payload too large
        '429':
          description: Rate limited

  /v1/traces:
    post:
      summary: Ingest traces (OTLP/HTTP)
      operationId: ingestOTLP
      description: |
        Accepts OpenTelemetry Protocol (OTLP) trace export requests.
        Supports both protobuf and JSON encoding.
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              description: OTLP ExportTraceServiceRequest JSON encoding
      responses:
        '200':
          description: Accepted (OTLP convention)
        '400':
          description: Invalid payload
        '401':
          description: Missing or invalid credentials

  /api/v1/health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string

  /api/v1/services:
    get:
      summary: List services with metrics summary
      operationId: listServices
      security:
        - session: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Service list with metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummary'

  /api/v1/services/{service}/operations:
    get:
      summary: List operations for a service with metrics
      operationId: listOperations
      security:
        - session: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Operation list with metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationSummary'

  /api/v1/dashboard/counts:
    get:
      summary: Span or trace counts over time, grouped by service, span name, span status or HTTP status code
      description: Reads raw spans, so the range is between 1 minute and 48 hours; windows up to 15 minutes use 15 second buckets. Only the ten largest groups keep their own series; the rest fold into "other".
      operationId: dashboardCounts
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardService'
        - $ref: '#/components/parameters/DashboardName'
        - $ref: '#/components/parameters/DashboardStatus'
        - $ref: '#/components/parameters/DashboardMinDuration'
        - $ref: '#/components/parameters/DashboardMaxDuration'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [service, name, status, http_status]
            default: service
        - name: root_only
          in: query
          description: Count only root spans (traces)
          schema:
            type: boolean
      responses:
        '200':
          description: Count series
          content:
            application/json:
              schema:
                type: object
                properties:
                  intervalSeconds:
                    type: integer
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        group:
                          type: string
                        count:
                          type: integer
        '400':
          description: Missing or invalid range, range over 48 hours, or unknown group_by

  /api/v1/dashboard/percentiles:
    get:
      summary: Exact P90/P95/P99 span duration over time, grouped by service, span name or span status
      description: Computed from raw span durations. Only the ten largest groups are returned.
      operationId: dashboardPercentiles
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardService'
        - $ref: '#/components/parameters/DashboardName'
        - $ref: '#/components/parameters/DashboardStatus'
        - $ref: '#/components/parameters/DashboardMinDuration'
        - $ref: '#/components/parameters/DashboardMaxDuration'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [service, name, status]
            default: service
      responses:
        '200':
          description: Percentile series, durations in microseconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  intervalSeconds:
                    type: integer
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        group:
                          type: string
                        count:
                          type: integer
                        p90Us:
                          type: integer
                        p95Us:
                          type: integer
                        p99Us:
                          type: integer
        '400':
          description: Missing or invalid range, range over 48 hours, or unknown group_by

  /api/v1/dashboard/heatmap:
    get:
      summary: Span duration distribution over time
      description: Populated cells only. Each duration bucket covers [lowerUs, upperUs) on a half-octave scale.
      operationId: dashboardHeatmap
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardService'
        - $ref: '#/components/parameters/DashboardName'
        - $ref: '#/components/parameters/DashboardStatus'
        - $ref: '#/components/parameters/DashboardMinDuration'
        - $ref: '#/components/parameters/DashboardMaxDuration'
        - name: root_only
          in: query
          description: Use only root spans (traces)
          schema:
            type: boolean
      responses:
        '200':
          description: Heatmap cells
          content:
            application/json:
              schema:
                type: object
                properties:
                  intervalSeconds:
                    type: integer
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        bucket:
                          type: integer
                          description: Duration bucket index; lowerUs is about 2^(bucket/2) - 1
                        lowerUs:
                          type: integer
                        upperUs:
                          type: integer
                        count:
                          type: integer
        '400':
          description: Missing or invalid range, or range over 48 hours

  /api/v1/trace-health/orphan-spans:
    get:
      summary: Spans whose parent span was never ingested, grouped by name, kind and service
      description: Project and range are required. The range is limited to 7 days because the parent lookup joins spans to themselves.
      operationId: traceHealthOrphanSpans
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/TraceHealthLimit'
      responses:
        '200':
          description: Orphan span groups, largest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    kind: {type: string}
                    service: {type: string}
                    count: {type: integer}
                    sampleTraceId: {type: string}
        '400':
          description: Missing project or range, reversed range, or range over 7 days

  /api/v1/trace-health/rootless-traces:
    get:
      summary: Traces that hold no root span
      description: Reads trace_summaries.has_root. Summaries from before migration 035 are included once the lazy backfill reaches them.
      operationId: traceHealthRootlessTraces
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/TraceHealthLimit'
      responses:
        '200':
          description: Total rootless traces in the window and the newest ones
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  traces:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraceSummary'
        '400':
          description: Missing project or range, reversed range, or range over 7 days

  /api/v1/trace-health/single-span-traces:
    get:
      summary: Traces with exactly one span, grouped by that span's name and service
      operationId: traceHealthSingleSpanTraces
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/TraceHealthLimit'
      responses:
        '200':
          description: Single-span trace groups, largest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    service: {type: string}
                    count: {type: integer}
                    sampleTraceId: {type: string}
        '400':
          description: Missing project or range, reversed range, or range over 7 days

  /api/v1/trace-health/span-names:
    get:
      summary: Stored span count and root_count per span name
      description: Entry points have root_count equal to count; internal helpers have root_count 0. Counts are stored spans, not sample-corrected.
      operationId: traceHealthSpanNames
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/TraceHealthLimit'
      responses:
        '200':
          description: Span names, most frequent first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    count: {type: integer}
                    rootCount: {type: integer}
        '400':
          description: Missing project or range, reversed range, or range over 7 days

  /api/v1/attributes:
    get:
      summary: Attribute keys of a project's spans with coverage, cardinality and top values
      description: >
        Project and range are required and the range is limited to 7 days. The scan reads at most
        max_spans spans (newest first, default 20000, at most 100000) from spans.attributes with json_each.
        Ranges over 24 hours read a 1-in-20 sample (id % 20 = 0) unless sample is given; sample=1 is exact.
        Counts cover the scanned spans, not the whole window. Storage decision:
        deploy/docs/attribute-storage-design.md.
      operationId: discoverAttributes
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - {name: span_name, in: query, description: Only spans with this name, schema: {type: string}}
        - {name: service, in: query, description: Only spans of this service, schema: {type: string}}
        - {name: key, in: query, description: Only this attribute key, with up to 100 top values, schema: {type: string}}
        - {name: sample, in: query, description: 'Keep 1 span in N, 1 to 1000', schema: {type: integer}}
        - {name: max_spans, in: query, description: Row cap on spans read, schema: {type: integer}}
        - {name: limit, in: query, description: Keys to return, default 50, at most 200, schema: {type: integer}}
        - {name: top, in: query, description: 'Values per key, default 5, at most 20 (100 with key)', schema: {type: integer}}
      responses:
        '200':
          description: Keys ordered by the number of spans that populate them
          content:
            application/json:
              schema:
                type: object
                properties:
                  scanned: {type: integer, description: Spans read after sampling}
                  sample: {type: integer, description: 1-in-N ratio applied}
                  truncated: {type: boolean, description: The scan stopped at maxSpans}
                  maxSpans: {type: integer}
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        spans: {type: integer}
                        coverage: {type: number, description: Share of scanned spans that populate the key}
                        distinct: {type: integer, description: Distinct values, capped at 1000}
                        distinctCapped: {type: boolean}
                        top:
                          type: array
                          items:
                            type: object
                            properties:
                              value: {type: string}
                              count: {type: integer}
        '400':
          description: Missing project or range, reversed range, range over 7 days, or sample out of range

  /api/v1/attributes/compare:
    get:
      summary: Rank the attributes whose values differ most between a selection and a baseline
      description: >
        BubbleUp-style comparison. Project, range and a non-empty selection filter are required; the range is
        limited to 7 days. The baseline defaults to every span of the project in the range, the selection
        included. Both sets are read through the same sample ratio (1 in 20 above 24 hours unless sample is
        given) and a row cap of max_spans spans (newest first, default 10000, at most 50000), so the cost is
        two bounded scans. Attributes are ranked by total variation distance: half the sum of the absolute
        differences between the value shares of the two sets, where spans that do not set the attribute count as
        a value of their own. 0 means identical, 1 means no value in common. The span columns service, name,
        kind and status are compared too; an attribute named like a span column is reported as attributes.NAME.
        Per attribute at most 200 distinct values are kept per set and the rest is summed, so the score of a
        high-cardinality attribute is approximate. Filter model: specs/001-telemetry-aggregator/data-model.md.
      operationId: compareAttributes
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - {name: selection, in: query, required: true, description: 'Filter model as JSON, the spans to explain', schema: {type: string}}
        - {name: baseline, in: query, description: 'Filter model as JSON, the spans to compare with; empty means all spans', schema: {type: string}}
        - {name: sample, in: query, description: 'Keep 1 span in N, 1 to 1000', schema: {type: integer}}
        - {name: max_spans, in: query, description: Row cap on spans read per set, schema: {type: integer}}
        - {name: limit, in: query, description: Attributes to return, default 20, at most 100, schema: {type: integer}}
        - {name: top, in: query, description: Values per attribute, default 5, at most 20, schema: {type: integer}}
      responses:
        '200':
          description: Attributes ordered by total variation distance, largest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  selection:
                    type: object
                    properties:
                      scanned: {type: integer}
                      truncated: {type: boolean}
                  baseline:
                    type: object
                    properties:
                      scanned: {type: integer}
                      truncated: {type: boolean}
                  sample: {type: integer}
                  maxSpans: {type: integer}
                  attributes:
                    type: array
                    items:
                      type: object
                      properties:
                        key: {type: string}
                        score: {type: number, description: Total variation distance, 0 to 1}
                        selectionCoverage: {type: number}
                        baselineCoverage: {type: number}
                        values:
                          type: array
                          description: Values that differ most, largest difference first
                          items:
                            type: object
                            properties:
                              value: {type: string}
                              missing: {type: boolean, description: The bucket of spans that do not set the attribute}
                              selectionCount: {type: integer}
                              selectionShare: {type: number}
                              baselineCount: {type: integer}
                              baselineShare: {type: number}
        '400':
          description: Missing project, range or selection, invalid filter, range over 7 days, or sample out of range

  /api/v1/heatmap:
    get:
      summary: Span duration distribution over time for a filtered span selection
      description: >
        Counts spans per time bucket and log-scale duration bucket, the input of a duration heatmap whose drag
        selection feeds /api/v1/attributes/compare. Project and range are required; the range is limited to 7
        days. The scan covers spans ingested in the range, newest first, and stops at max_spans (default 20000,
        at most 100000); capped says when it did. Time buckets divide the range evenly and use the span start
        time, with spans that started before from counted in the first bucket. Duration edges run from the
        shortest to the longest scanned duration, evenly spaced on a log scale. Bucket i holds durations in
        [edges[i], edges[i+1]), and the last bucket includes its upper edge. Empty cells are left out.
        Filter model: specs/001-telemetry-aggregator/data-model.md.
      operationId: getHeatmap
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - {name: filter, in: query, description: 'Filter model as JSON; empty means every span of the project', schema: {type: string}}
        - {name: time_buckets, in: query, description: Default 60, at most 200, schema: {type: integer}}
        - {name: duration_buckets, in: query, description: Default 30, at most 100, schema: {type: integer}}
        - {name: max_spans, in: query, description: Row cap on spans read, schema: {type: integer}}
      responses:
        '200':
          description: Bucket counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: {type: string, format: date-time}
                  to: {type: string, format: date-time}
                  timeBuckets: {type: integer}
                  durationBuckets: {type: integer}
                  bucketMicros: {type: integer, description: Width of one time bucket in microseconds}
                  durationEdgesUs:
                    type: array
                    description: durationBuckets + 1 ascending edges in microseconds, empty when no span matched
                    items: {type: integer}
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        time: {type: integer, description: Time bucket index}
                        duration: {type: integer, description: Duration bucket index}
                        count: {type: integer}
                  scanned: {type: integer}
                  capped: {type: boolean, description: True when the scan stopped at maxSpans}
                  maxSpans: {type: integer}
        '400':
          description: Missing project or range, invalid filter, or range over 7 days

  /api/v1/spans/search:
    get:
      summary: List spans matching a filter expression
      description: >
        The filter model is described in specs/001-telemetry-aggregator/data-model.md (saved_queries).
        Project and from are required. Newest first, at most 200 spans.
        GET /api/v1/traces accepts the same filter parameter and returns the traces that hold a matching span.
      operationId: searchSpans
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - {name: filter, in: query, description: 'Filter model as JSON', schema: {type: string}}
        - {name: limit, in: query, description: Default 50, at most 200, schema: {type: integer}}
        - {name: offset, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Matching spans
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    traceId: {type: string}
                    spanId: {type: string}
                    parentSpanId: {type: string}
                    name: {type: string}
                    service: {type: string}
                    kind: {type: string}
                    status: {type: string}
                    startTime: {type: string, format: date-time}
                    durationUs: {type: integer}
                    attributes: {type: object}
        '400':
          description: Invalid filter, or a filter without a time range

  /api/v1/analyze:
    get:
      summary: Calculations per group over spans
      description: >
        Group-by query over the spans of one project in a required time range (at most 30 days).
        Calculations are count, error_rate, sum_duration, avg_duration, max_duration, p50, p95, p99
        and count_distinct:<attribute>. Durations are microseconds. Groups beyond the cap fold into
        the other row. Each group row has a drill filter that selects its spans.
        See specs/001-telemetry-aggregator/data-model.md (Group-by queries).
      operationId: analyze
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - {name: filter, in: query, description: 'Filter model as JSON', schema: {type: string}}
        - {name: group_by, in: query, description: 'Span column or attribute key, repeat for up to 4', schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: calc, in: query, description: 'Calculation, repeat for several. Default count', schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: order_by, in: query, description: 'One of the calc values, default the first', schema: {type: string}}
        - {name: order, in: query, description: 'asc or desc (default)', schema: {type: string}}
        - {name: limit, in: query, description: 'Group cap, default 20, at most 100', schema: {type: integer}}
        - {name: sample, in: query, description: '1 in N spans. 0 or unset picks the ratio from max_spans', schema: {type: integer}}
        - {name: max_spans, in: query, description: 'Row cap on spans read, default 200000, at most 500000', schema: {type: integer}}
      responses:
        '200':
          description: One row per group
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupBy: {type: array, items: {type: string}}
                  calcs: {type: array, items: {type: string}}
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        group: {type: array, items: {type: string}}
                        count: {type: integer}
                        values: {type: array, items: {type: number}}
                        drill: {type: object}
                  other: {type: object}
                  scanned: {type: integer}
                  sampleEvery: {type: integer}
                  truncated: {type: boolean}
                  maxSpans: {type: integer}
        '400':
          description: Missing project or range, range over 30 days, invalid filter, key or calculation

  /api/v1/analyze/series:
    get:
      summary: One calculation over time for the largest groups
      description: >
        Takes the parameters of /api/v1/analyze, one calc, and bucket (seconds, default about 48 buckets).
        Returns the top groups (limit default 5, at most 10) and an other line.
      operationId: analyzeSeries
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - {name: filter, in: query, schema: {type: string}}
        - {name: group_by, in: query, schema: {type: array, items: {type: string}}, style: form, explode: true}
        - {name: calc, in: query, schema: {type: string}}
        - {name: bucket, in: query, description: 'Bucket length in seconds, at most 500 buckets', schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer}}
        - {name: sample, in: query, schema: {type: integer}}
        - {name: max_spans, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Lines aligned to buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  calc: {type: string}
                  bucketSeconds: {type: integer}
                  buckets: {type: array, items: {type: integer}}
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        group: {type: array, items: {type: string}}
                        other: {type: boolean}
                        values: {type: array, items: {type: number, nullable: true}}
                  scanned: {type: integer}
                  sampleEvery: {type: integer}
                  truncated: {type: boolean}
        '400':
          description: As /api/v1/analyze, or more than one calculation

  /api/v1/boards:
    get:
      summary: List the boards of a project, newest first, without panels
      operationId: listBoards
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
      responses:
        '200':
          description: Boards
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Board'}
    post:
      summary: Create an empty board
      operationId: createBoard
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BoardSettings'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        '400':
          description: Missing project or name, or a range or refresh interval that is not offered

  /api/v1/boards/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: Get a board with its panels in order
      operationId: getBoard
      security:
        - session: []
      responses:
        '200':
          description: The board
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Board'}
        '404':
          description: No such board
    put:
      summary: Replace the name, shared time range and refresh interval
      operationId: updateBoard
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BoardSettings'}
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid name, range or refresh interval
        '404':
          description: No such board
    delete:
      summary: Delete a board, its panels and the queries only those panels used
      operationId: deleteBoard
      security:
        - session: []
      responses:
        '200':
          description: Deleted
        '404':
          description: No such board

  /api/v1/boards/{id}/panels:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      summary: Save a query to the board as a new last panel
      description: >
        Stores the query (filters plus definition) and the panel in one transaction.
        A board holds at most 50 panels. See specs/001-telemetry-aggregator/data-model.md (boards).
      operationId: addBoardPanel
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                title: {type: string, maxLength: 200}
                view: {type: string, enum: [table, chart], default: table}
                filters: {type: object, description: 'Filter model'}
                definition: {$ref: '#/components/schemas/QueryDefinition'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        '400':
          description: Invalid filter or definition, or the board is full
        '404':
          description: No such board

  /api/v1/boards/{id}/panels/order:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    put:
      summary: Set the panel order
      operationId: reorderBoardPanels
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [panelIds]
              properties:
                panelIds: {type: array, items: {type: integer}, description: 'Every panel of the board once'}
      responses:
        '200':
          description: Reordered
        '400':
          description: The list is not exactly the panels of the board
        '404':
          description: No such board

  /api/v1/boards/{id}/panels/{panel}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: panel, in: path, required: true, schema: {type: integer}}
    put:
      summary: Rename a panel and switch it between table and chart
      operationId: updateBoardPanel
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, view]
              properties:
                title: {type: string, maxLength: 200}
                view: {type: string, enum: [table, chart]}
      responses:
        '200':
          description: Updated
        '400':
          description: Invalid title or view
        '404':
          description: No such panel on this board
    delete:
      summary: Remove a panel, and its query when no other panel uses it
      operationId: deleteBoardPanel
      security:
        - session: []
      responses:
        '200':
          description: Removed
        '404':
          description: No such panel on this board

  /api/v1/calculated-fields:
    get:
      summary: List the calculated fields of a project by name
      operationId: listCalculatedFields
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
      responses:
        '200':
          description: Calculated fields
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CalculatedField'}
        '400':
          description: Missing project
    post:
      summary: Define a calculated field
      description: >
        A calculated field is a named expression that filters, group-bys and the attribute
        comparison use like a span column or attribute key. The grammar is closed (see
        specs/001-telemetry-aggregator/data-model.md, calculated_fields); no raw SQL is accepted.
        A project holds at most 50 fields.
      operationId: createCalculatedField
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalculatedFieldBody'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        '400':
          description: >
            Missing project, an invalid or duplicate name, a name that shadows a span column,
            an expression that does not parse, is over the length (500 characters), depth (16),
            term (200) or argument (8) cap, uses an unknown function, or closes a cycle between fields

  /api/v1/calculated-fields/preview:
    post:
      summary: Evaluate an unsaved expression on the newest spans of a project
      description: >
        Validates like create and returns the value of the expression for up to 5 recent spans.
        An empty name previews a new field. A name of an existing field previews an edit of it.
      operationId: previewCalculatedField
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalculatedFieldBody'}
      responses:
        '200':
          description: Sample values
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        spanId: {type: string}
                        name: {type: string, description: 'Span name'}
                        value: {description: 'Number, string or null'}
        '400':
          description: As create

  /api/v1/calculated-fields/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    put:
      summary: Replace the name and expression of a field
      operationId: updateCalculatedField
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalculatedFieldBody'}
      responses:
        '200':
          description: Updated
        '400':
          description: As create
        '404':
          description: No such field
    delete:
      summary: Delete a field
      description: A key that named the field reads as a plain attribute afterwards.
      operationId: deleteCalculatedField
      security:
        - session: []
      responses:
        '200':
          description: Deleted
        '404':
          description: No such field

  /api/v1/releases:
    get:
      summary: Release markers of a project in a time range, oldest first
      operationId: listReleases
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/TraceHealthProject'
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
      responses:
        '200':
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Release'}
        '400':
          description: Missing project or range
    post:
      summary: Record a release marker
      operationId: createRelease
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, version]
              properties:
                projectId: {type: integer}
                version: {type: string, maxLength: 120}
                releasedAt: {type: string, format: date-time, description: 'Default now'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        '400':
          description: Missing project or version

  /api/v1/slos:
    parameters:
      - $ref: '#/components/parameters/TraceHealthProject'
    get:
      summary: List the SLOs of a project
      operationId: listSLOs
      security:
        - session: []
      responses:
        '200':
          description: SLOs, empty when the project has none
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SLO'}
        '400':
          description: Missing project
    post:
      summary: Create an SLO
      description: >
        The SLO is the share of spans matching goodFilter among those matching totalFilter,
        held to target over a rolling window of windowDays.
      operationId: createSLO
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SLOSettings'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        '400':
          description: Missing project or name, target outside (0, 1), window outside 1 to 90 days, or an invalid filter
        '409':
          description: The name is already used in the project

  /api/v1/slos/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - $ref: '#/components/parameters/TraceHealthProject'
    get:
      summary: Get an SLO
      operationId: getSLO
      security:
        - session: []
      responses:
        '200':
          description: The SLO
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SLO'}
        '404':
          description: No such SLO in this project
    put:
      summary: Replace the editable fields of an SLO
      operationId: updateSLO
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SLOSettings'}
      responses:
        '200':
          description: Updated
        '400':
          description: As createSLO
        '404':
          description: No such SLO in this project
        '409':
          description: The name is already used in the project
    delete:
      summary: Delete an SLO with its burn alerts and counts
      operationId: deleteSLO
      security:
        - session: []
      responses:
        '200':
          description: Deleted
        '404':
          description: No such SLO in this project

  /api/v1/slos/{id}/status:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - $ref: '#/components/parameters/TraceHealthProject'
    get:
      summary: Error budget remaining, good and total counts, and the burn of each alert window
      operationId: getSLOStatus
      security:
        - session: []
      responses:
        '200':
          description: Status. With no traffic the budget is 1 and every burn is 0
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SLOStatus'}
        '404':
          description: No such SLO in this project

  /api/v1/slos/{id}/burn-alerts:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - $ref: '#/components/parameters/TraceHealthProject'
    get:
      summary: List the burn alerts of an SLO
      operationId: listSLOBurnAlerts
      security:
        - session: []
      responses:
        '200':
          description: Burn alerts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SLOBurnAlert'}
        '404':
          description: No such SLO in this project
    post:
      summary: Add a burn alert to an SLO
      operationId: createSLOBurnAlert
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SLOBurnAlertSettings'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {type: object, properties: {id: {type: integer}}}
        '400':
          description: Window not shorter than the SLO window, burn rate not above 0, or an invalid webhook URL or email
        '404':
          description: No such SLO in this project

  /api/v1/slos/{id}/burn-alerts/{alertId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: alertId, in: path, required: true, schema: {type: integer}}
      - $ref: '#/components/parameters/TraceHealthProject'
    put:
      summary: Replace the editable fields of a burn alert
      operationId: updateSLOBurnAlert
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SLOBurnAlertSettings'}
      responses:
        '200':
          description: Updated
        '400':
          description: As createSLOBurnAlert
        '404':
          description: No such burn alert on this SLO in this project
    delete:
      summary: Remove a burn alert
      operationId: deleteSLOBurnAlert
      security:
        - session: []
      responses:
        '200':
          description: Removed
        '404':
          description: No such burn alert on this SLO in this project

  /api/v1/traces/{traceId}:
    get:
      summary: Get full trace by ID
      operationId: getTrace
      security:
        - session: []
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace with all spans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '404':
          description: Trace not found

components:
  parameters:
    DashboardFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    DashboardTo:
      name: to
      in: query
      required: true
      description: Must be after from, and at most 48 hours later
      schema:
        type: string
        format: date-time
    DashboardProject:
      name: project_id
      in: query
      description: Omit or 0 for all projects
      schema:
        type: integer
    DashboardService:
      name: service
      in: query
      schema:
        type: string
    DashboardName:
      name: name
      in: query
      description: Span name
      schema:
        type: string
    DashboardStatus:
      name: status
      in: query
      description: Span status (ok, error, unset)
      schema:
        type: string
    DashboardMinDuration:
      name: min_duration_us
      in: query
      description: Keep spans at least this long, in microseconds
      schema:
        type: integer
        minimum: 0
    DashboardMaxDuration:
      name: max_duration_us
      in: query
      description: Keep spans at most this long, in microseconds. Must not be below min_duration_us.
      schema:
        type: integer
        minimum: 0
    TraceHealthProject:
      name: project_id
      in: query
      required: true
      schema:
        type: integer
    TraceHealthLimit:
      name: limit
      in: query
      description: Rows to return, default 100, at most 500
      schema:
        type: integer
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-SpanBarn-Api-Key
    bearerAuth:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: session

  schemas:
    QueryDefinition:
      type: object
      required: [calcs]
      description: The part of a board query the filter model does not carry. Names match the /api/v1/analyze parameters.
      properties:
        groupBy: {type: array, items: {type: string}, maxItems: 4}
        calcs: {type: array, items: {type: string}, minItems: 1, maxItems: 9}
        orderBy: {type: string, description: 'One of calcs'}
        asc: {type: boolean}
        limit: {type: integer, maximum: 100}
        sample: {type: integer}
        chartCalc: {type: string, description: 'One of calcs. The calculation a chart panel draws, default the first'}
    BoardSettings:
      type: object
      properties:
        projectId: {type: integer, description: 'Create only'}
        name: {type: string, maxLength: 120}
        timeRange: {type: string, enum: ['1h', '24h', '7d', '30d'], default: '24h'}
        refreshSeconds: {type: integer, enum: [0, 30, 60, 300, 900]}
    Board:
      type: object
      properties:
        id: {type: integer}
        projectId: {type: integer}
        name: {type: string}
        timeRange: {type: string}
        refreshSeconds: {type: integer}
        panels:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              boardId: {type: integer}
              savedQueryId: {type: integer}
              title: {type: string}
              view: {type: string, enum: [table, chart]}
              position: {type: integer}
              query:
                type: object
                properties:
                  id: {type: integer}
                  filters: {type: object, description: 'Filter model'}
                  definition: {$ref: '#/components/schemas/QueryDefinition'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CalculatedFieldBody:
      type: object
      required: [name, expression]
      properties:
        projectId: {type: integer, description: 'Create and preview only'}
        name:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z_][A-Za-z0-9_.]*$'
          description: 'Not a span column and not starting with "attributes."'
        expression: {type: string, maxLength: 500}
    CalculatedField:
      type: object
      properties:
        id: {type: integer}
        projectId: {type: integer}
        name: {type: string}
        expression: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Release:
      type: object
      properties:
        id: {type: integer}
        projectId: {type: integer}
        version: {type: string}
        releasedAt: {type: string, format: date-time}
    SLOSettings:
      type: object
      required: [name, target, windowDays]
      properties:
        name: {type: string, maxLength: 120, description: 'Unique within the project'}
        goodFilter: {type: object, description: 'Filter model. Spans that count as good. Empty matches every span'}
        totalFilter: {type: object, description: 'Filter model. Spans that count at all. Empty matches every span'}
        target: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, example: 0.995}
        windowDays: {type: integer, minimum: 1, maximum: 90}
    SLO:
      type: object
      properties:
        id: {type: integer}
        projectId: {type: integer}
        name: {type: string}
        goodFilter: {type: object, description: 'Filter model'}
        totalFilter: {type: object, description: 'Filter model'}
        target: {type: number}
        windowDays: {type: integer}
        createdAt: {type: string, format: date-time}
    SLOBurnAlertSettings:
      type: object
      required: [windowMinutes, burnRate]
      properties:
        windowMinutes: {type: integer, minimum: 1, description: 'Shorter than the SLO window'}
        burnRate: {type: number, exclusiveMinimum: 0, description: 'Fires when the burn over the window reaches this. 1 spends the budget exactly on pace'}
        webhookUrl: {type: string, description: 'http or https URL. Empty for none'}
        email: {type: string}
        cooldownMinutes: {type: integer, minimum: 0, default: 30, description: '0 means the default'}
        enabled: {type: boolean, default: true}
    SLOBurnAlert:
      type: object
      properties:
        id: {type: integer}
        sloId: {type: integer}
        windowMinutes: {type: integer}
        burnRate: {type: number}
        webhookUrl: {type: string}
        email: {type: string}
        cooldownMinutes: {type: integer}
        enabled: {type: boolean}
        firing: {type: boolean, description: 'True between the crossing and the recovery'}
        lastTriggeredAt: {type: [string, 'null'], format: date-time}
    SLOStatus:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        target: {type: number}
        windowDays: {type: integer}
        good: {type: integer, description: 'Good events in the SLO window'}
        total: {type: integer, description: 'All events in the SLO window'}
        budgetRemaining:
          type: number
          description: '1 is untouched, 0 is spent, below 0 is overspent. 1 with no traffic'
        alerts:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              windowMinutes: {type: integer}
              burnRate: {type: number, description: 'The alert threshold'}
              enabled: {type: boolean}
              currentBurn: {type: number, description: 'Burn rate over the alert window. 0 with no traffic'}
              good: {type: integer}
              total: {type: integer}
              firing: {type: boolean}
    TraceSummary:
      type: object
      properties:
        traceId: {type: string}
        rootSpanName:
          type: string
          description: Empty when the trace has no root span
        rootService: {type: string}
        durationUs: {type: integer}
        spanCount: {type: integer}
        status: {type: string}
        startTime: {type: string, format: date-time}
        hasRoot:
          type: [boolean, 'null']
          description: null while the summary's structure is not computed yet
        orphanCount:
          type: integer
          description: Spans whose parent is absent from the trace
    SpanBatch:
      type: object
      required:
        - spans
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'

    Span:
      type: object
      required:
        - traceId
        - spanId
        - name
        - service
        - startTime
        - duration
      properties:
        traceId:
          type: string
          description: 32-character hex trace identifier
        spanId:
          type: string
          description: 16-character hex span identifier
        parentSpanId:
          type: string
          nullable: true
        name:
          type: string
          description: Operation name (e.g. GET /api/users)
        service:
          type: string
        resource:
          type: string
          description: Route, query, or target identifier
        kind:
          type: string
          enum: [server, client, internal, producer, consumer]
          default: internal
        status:
          type: string
          enum: [ok, error, unset]
          default: unset
        startTime:
          type: integer
          format: int64
          description: Unix timestamp in microseconds
        duration:
          type: integer
          format: int64
          description: Duration in microseconds
        attributes:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              time:
                type: integer
                format: int64
              attributes:
                type: object
                additionalProperties: true

    ServiceSummary:
      type: object
      properties:
        service:
          type: string
        spanCount:
          type: integer
        errorCount:
          type: integer
        errorRate:
          type: number
          format: float
        p50Us:
          type: integer
        p95Us:
          type: integer
        p99Us:
          type: integer

    OperationSummary:
      type: object
      properties:
        operation:
          type: string
        resource:
          type: string
        kind:
          type: string
        spanCount:
          type: integer
        errorCount:
          type: integer
        errorRate:
          type: number
          format: float
        p50Us:
          type: integer
        p95Us:
          type: integer
        p99Us:
          type: integer

    Trace:
      type: object
      properties:
        traceId:
          type: string
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'
        duration:
          type: integer
          description: Total trace duration in microseconds
        service:
          type: string
          description: Root span service
        name:
          type: string
          description: Root span name
