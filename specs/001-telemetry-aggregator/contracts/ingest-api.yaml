openapi: 3.1.0
info:
  title: SpanBarn Ingest API
  version: 0.1.0
  description: Span ingestion endpoints for SpanBarn telemetry aggregator

servers:
  - url: http://localhost:8080

paths:
  /api/v1/spans:
    post:
      summary: Ingest spans (native JSON format)
      operationId: ingestSpans
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpanBatch'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer
        '400':
          description: Invalid payload
        '401':
          description: Missing or invalid API key
        '413':
          description: Payload too large
        '429':
          description: Rate limited

  /v1/traces:
    post:
      summary: Ingest traces (OTLP/HTTP)
      operationId: ingestOTLP
      description: |
        Accepts OpenTelemetry Protocol (OTLP) trace export requests.
        Supports both protobuf and JSON encoding.
      security:
        - apiKey: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              description: OTLP ExportTraceServiceRequest JSON encoding
      responses:
        '200':
          description: Accepted (OTLP convention)
        '400':
          description: Invalid payload
        '401':
          description: Missing or invalid credentials

  /api/v1/health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string

  /api/v1/services:
    get:
      summary: List services with metrics summary
      operationId: listServices
      security:
        - session: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Service list with metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummary'

  /api/v1/services/{service}/operations:
    get:
      summary: List operations for a service with metrics
      operationId: listOperations
      security:
        - session: []
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Operation list with metrics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationSummary'

  /api/v1/dashboard/counts:
    get:
      summary: Span or trace counts over time, grouped by service or HTTP status code
      description: Reads raw spans, so the range is limited to 48 hours. Only the ten largest groups keep their own series; the rest fold into "other".
      operationId: dashboardCounts
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardService'
        - $ref: '#/components/parameters/DashboardName'
        - $ref: '#/components/parameters/DashboardStatus'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [service, http_status]
            default: service
        - name: root_only
          in: query
          description: Count only root spans (traces)
          schema:
            type: boolean
      responses:
        '200':
          description: Count series
          content:
            application/json:
              schema:
                type: object
                properties:
                  intervalSeconds:
                    type: integer
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        group:
                          type: string
                        count:
                          type: integer
        '400':
          description: Missing or invalid range, range over 48 hours, or unknown group_by

  /api/v1/dashboard/percentiles:
    get:
      summary: Exact P90/P95/P99 span duration over time, grouped by service or span name
      description: Computed from raw span durations. Only the ten largest groups are returned.
      operationId: dashboardPercentiles
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardService'
        - $ref: '#/components/parameters/DashboardName'
        - $ref: '#/components/parameters/DashboardStatus'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [service, name]
            default: service
      responses:
        '200':
          description: Percentile series, durations in microseconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  intervalSeconds:
                    type: integer
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        group:
                          type: string
                        count:
                          type: integer
                        p90Us:
                          type: integer
                        p95Us:
                          type: integer
                        p99Us:
                          type: integer
        '400':
          description: Missing or invalid range, range over 48 hours, or unknown group_by

  /api/v1/dashboard/heatmap:
    get:
      summary: Span duration distribution over time
      description: Populated cells only. Each duration bucket covers [lowerUs, upperUs) on a half-octave scale.
      operationId: dashboardHeatmap
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/DashboardFrom'
        - $ref: '#/components/parameters/DashboardTo'
        - $ref: '#/components/parameters/DashboardProject'
        - $ref: '#/components/parameters/DashboardService'
        - $ref: '#/components/parameters/DashboardName'
        - $ref: '#/components/parameters/DashboardStatus'
        - name: root_only
          in: query
          description: Use only root spans (traces)
          schema:
            type: boolean
      responses:
        '200':
          description: Heatmap cells
          content:
            application/json:
              schema:
                type: object
                properties:
                  intervalSeconds:
                    type: integer
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                          format: date-time
                        bucket:
                          type: integer
                          description: Duration bucket index; lowerUs is about 2^(bucket/2) - 1
                        lowerUs:
                          type: integer
                        upperUs:
                          type: integer
                        count:
                          type: integer
        '400':
          description: Missing or invalid range, or range over 48 hours

  /api/v1/traces/{traceId}:
    get:
      summary: Get full trace by ID
      operationId: getTrace
      security:
        - session: []
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace with all spans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trace'
        '404':
          description: Trace not found

components:
  parameters:
    DashboardFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    DashboardTo:
      name: to
      in: query
      required: true
      description: Must be after from, and at most 48 hours later
      schema:
        type: string
        format: date-time
    DashboardProject:
      name: project_id
      in: query
      description: Omit or 0 for all projects
      schema:
        type: integer
    DashboardService:
      name: service
      in: query
      schema:
        type: string
    DashboardName:
      name: name
      in: query
      description: Span name
      schema:
        type: string
    DashboardStatus:
      name: status
      in: query
      description: Span status (ok, error, unset)
      schema:
        type: string
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-SpanBarn-Api-Key
    bearerAuth:
      type: http
      scheme: bearer
    session:
      type: apiKey
      in: cookie
      name: session

  schemas:
    SpanBatch:
      type: object
      required:
        - spans
      properties:
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'

    Span:
      type: object
      required:
        - traceId
        - spanId
        - name
        - service
        - startTime
        - duration
      properties:
        traceId:
          type: string
          description: 32-character hex trace identifier
        spanId:
          type: string
          description: 16-character hex span identifier
        parentSpanId:
          type: string
          nullable: true
        name:
          type: string
          description: Operation name (e.g. GET /api/users)
        service:
          type: string
        resource:
          type: string
          description: Route, query, or target identifier
        kind:
          type: string
          enum: [server, client, internal, producer, consumer]
          default: internal
        status:
          type: string
          enum: [ok, error, unset]
          default: unset
        startTime:
          type: integer
          format: int64
          description: Unix timestamp in microseconds
        duration:
          type: integer
          format: int64
          description: Duration in microseconds
        attributes:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              time:
                type: integer
                format: int64
              attributes:
                type: object
                additionalProperties: true

    ServiceSummary:
      type: object
      properties:
        service:
          type: string
        spanCount:
          type: integer
        errorCount:
          type: integer
        errorRate:
          type: number
          format: float
        p50Us:
          type: integer
        p95Us:
          type: integer
        p99Us:
          type: integer

    OperationSummary:
      type: object
      properties:
        operation:
          type: string
        resource:
          type: string
        kind:
          type: string
        spanCount:
          type: integer
        errorCount:
          type: integer
        errorRate:
          type: number
          format: float
        p50Us:
          type: integer
        p95Us:
          type: integer
        p99Us:
          type: integer

    Trace:
      type: object
      properties:
        traceId:
          type: string
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'
        duration:
          type: integer
          description: Total trace duration in microseconds
        service:
          type: string
          description: Root span service
        name:
          type: string
          description: Root span name
