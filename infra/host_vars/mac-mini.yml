# Mac Mini - GitHub Actions runner configuration for SpanBarn

# Connection. These used to live in inventory.ini as ansible_connection=local
# for BOTH Macs, which meant running the playbook anywhere applied *both* hosts'
# runner lists to whatever machine you happened to be on. That is how all four
# spanbarn runners — including spanbarn-laptop-1 and spanbarn-laptop-2 — ended
# up on the Mac mini, while still being named mac-laptop-* (agentName is
# "{{ inventory_hostname }}-{{ runner_name }}"). Addressing each host explicitly
# makes the playbook target the machine it names, from wherever it is run.
ansible_host: "{{ lookup('env', 'SPANBARN_MAC_MINI_HOST') | default('mini.local', true) }}"
ansible_user: "{{ lookup('env', 'SPANBARN_MAC_MINI_USER') | default('wiebe', true) }}"
ansible_connection: ssh
ansible_python_interpreter: /usr/bin/python3

github_runner_enabled: true
github_runner_version: "2.334.0"
github_runner_base_dir: /Users/wiebe/github-runners
github_runner_user: wiebe
github_runner_battery_aware: false
github_runners:
  - name: "spanbarn-mac-1"
    repo: "wiebe-xyz/spanbarn"
    labels: "build,mac-mini,macos,arm64"
  - name: "spanbarn-mac-2"
    repo: "wiebe-xyz/spanbarn"
    labels: "build,mac-mini,macos,arm64"
