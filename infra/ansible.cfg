[defaults]
# rapid-root's shared roles (github-runner-macos, github-runner). This relative
# path only resolves from the primary checkout, where rapid-root sits beside
# spanbarn. From a git worktree it points inside .claude/worktrees and the role
# is "not found". Use the Makefile, which exports an ANSIBLE_ROLES_PATH probed
# across both.
roles_path = ../../rapid-root/infra/roles
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
