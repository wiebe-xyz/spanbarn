apiVersion: v1
kind: Service
metadata:
  name: spanbarn-reads
spec:
  # Only the ingest pod (read-only DB) serves dashboard reads. Putting the
  # writer here too caused a race during Recreate rollouts: k8s endpoints
  # update lags pod termination, so in-flight reads briefly got RST'd. The
  # ingest pod uses RollingUpdate (maxSurge=1, maxUnavailable=0) so it has
  # no equivalent gap of its own.
  selector:
    app.kubernetes.io/name: spanbarn-ingest
  ports:
    - name: http
      port: 8080
      targetPort: http
