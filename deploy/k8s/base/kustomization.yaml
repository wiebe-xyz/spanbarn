apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - deployment-ingest.yaml
  - service-ingest.yaml
  - deployment-web.yaml
  - service-web.yaml
  - deployment-redis.yaml
  - service-redis.yaml
  - deployment-redis-queue.yaml
  - service-redis-queue.yaml
  - configmap.yaml
  - service-reads.yaml
  # sc-spanbarn-data.yaml, pv-spanbarn-data.yaml and pvc.yaml are one-time
  # cluster-setup resources — apply them manually when provisioning a new
  # cluster. Keeping them out of the rolling-deploy base prevents kubectl apply
  # from hitting immutable-field or resize errors on existing PVCs.
