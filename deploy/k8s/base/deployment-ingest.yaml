apiVersion: apps/v1
kind: Deployment
metadata:
  name: spanbarn-ingest
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spanbarn-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spanbarn-ingest
        spanbarn.io/serves-reads: "true"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: spanbarn-ingest
          image: ghcr.io/wiebe-xyz/spanbarn/service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPANBARN_MODE
              value: "reader"
            - name: SPANBARN_REDIS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: spanbarn-secrets
                  key: SPANBARN_REDIS_QUEUE_URL
            - name: SPANBARN_ADDR
              value: ":8080"
            - name: SPANBARN_SPOOL_DIR
              value: "/tmp/spool"
            - name: SPANBARN_DB_PATH
              value: "/var/lib/spanbarn/spanbarn.db"
            # Tell Go's GC the soft cap so it reacts to memory pressure before
            # the cgroup OOM-kills us. ~90% of the 512Mi limit, leaving room for
            # the read-only SQLite page cache (32 MiB) + reclaimable mmap window.
            - name: GOMEMLIMIT
              value: "448MiB"
          envFrom:
            - secretRef:
                name: spanbarn-secrets
          volumeMounts:
            - name: spanbarn-data
              mountPath: /var/lib/spanbarn
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: spanbarn-data
          persistentVolumeClaim:
            claimName: spanbarn-data
