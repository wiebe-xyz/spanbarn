apiVersion: apps/v1
kind: Deployment
metadata:
  name: spanbarn-ingest
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spanbarn-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spanbarn-ingest
        spanbarn.io/serves-reads: "true"
    spec:
      # The grace period counts from the preStop sleep: 10s sleep, then SIGTERM,
      # up to 10s for HTTP shutdown, up to 35s for the trace buffer to drain in
      # order (root grace 30s plus slack), then the spool flush.
      terminationGracePeriodSeconds: 90
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: spanbarn-ingest
          image: ghcr.io/wiebe-xyz/spanbarn/service:latest
          imagePullPolicy: IfNotPresent
          # Keep the listener up while the endpoint removal propagates, so
          # requests routed to the old pod are served and not refused.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPANBARN_MODE
              value: "reader"
            - name: SPANBARN_REDIS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: spanbarn-secrets
                  key: SPANBARN_REDIS_QUEUE_URL
            - name: SPANBARN_ADDR
              value: ":8080"
            # This pod serves /api/v1/client-config to the browser but takes no
            # spanbarn-config envFrom, so the public BrandTrace site key has to
            # arrive by name. Environments without the key leave it unset and
            # the dashboard loads no tracker.
            - name: SPANBARN_BRANDTRACE_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: spanbarn-config
                  key: SPANBARN_BRANDTRACE_SITE_KEY
                  optional: true
            - name: SPANBARN_SPOOL_DIR
              value: "/tmp/spool"
            - name: SPANBARN_DB_PATH
              value: "/var/lib/spanbarn/spanbarn.db"
            # Tell Go's GC the soft cap so it reacts to memory pressure before
            # the cgroup OOM-kills us. ~90% of the 512Mi limit, leaving room for
            # the read-only SQLite page cache (32 MiB) + reclaimable mmap window.
            - name: GOMEMLIMIT
              value: "448MiB"
          envFrom:
            - secretRef:
                name: spanbarn-secrets
          volumeMounts:
            - name: spanbarn-data
              mountPath: /var/lib/spanbarn
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: spanbarn-data
          persistentVolumeClaim:
            claimName: spanbarn-data
