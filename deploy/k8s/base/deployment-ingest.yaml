apiVersion: apps/v1
kind: Deployment
metadata:
  name: spanbarn-ingest
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spanbarn-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spanbarn-ingest
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: spanbarn-ingest
          image: ghcr.io/wiebe-xyz/spanbarn/service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPANBARN_MODE
              value: "ingest"
            - name: SPANBARN_WRITER_URL
              value: "http://spanbarn:8080"
            - name: SPANBARN_ADDR
              value: ":8080"
            - name: SPANBARN_SPOOL_DIR
              value: "/tmp/spool"
          envFrom:
            - secretRef:
                name: spanbarn-secrets
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
