apiVersion: v1
kind: ConfigMap
metadata:
  name: spanbarn-config
data:
  SPANBARN_ADDR: ":8080"
  SPANBARN_DB_PATH: "/var/lib/spanbarn/spanbarn.db"
  SPANBARN_SPOOL_DIR: "/var/lib/spanbarn/spool"
  # SPANBARN_RETENTION_FULL_HOURS is deliberately absent: it was obsolete and
  # wired to nothing, so every environment ran with "4" here believing spans were
  # kept 4 hours while they were actually kept for the interesting window. The
  # app now warns if it is set. Span retention is
  # SPANBARN_RETENTION_INTERESTING_HOURS; uninteresting spans expire via
  # SPANBARN_BORING_RETENTION_MINUTES.
  SPANBARN_RETENTION_ERROR_DAYS: "30"
  SPANBARN_RETENTION_AGGREGATED_DAYS: "90"
  SPANBARN_AGGREGATION_INTERVAL: "5m"
  # Metric rollup tiers. The writer compacts rollups 5m → 1h → 1d → 1w → 1mo and
  # each tier keeps its own window, so storage is bounded by resolution rather
  # than by one cutoff: recent data stays fine-grained, old data stays readable
  # for years at a few thousand rows a month. A tier is deleted only as far as it
  # has been compacted into the next one, so a stalled compactor delays cleanup
  # instead of losing history.
  #
  # These are written out rather than left to defaults because the window that
  # filled production had a default and no wiring: the 5-minute tier reached
  # 3.7 GB, 76% of the database, while nothing could change it.
  SPANBARN_METRIC_ROLLUP_RETENTION_DAYS: "2"
  SPANBARN_METRIC_ROLLUP_HOURLY_DAYS: "30"
  SPANBARN_METRIC_ROLLUP_DAILY_DAYS: "365"
  SPANBARN_METRIC_ROLLUP_WEEKLY_DAYS: "730"
  # 0 keeps the monthly tier indefinitely — about a megabyte a year here.
  SPANBARN_METRIC_ROLLUP_MONTHLY_DAYS: "0"
  # Span staging (tail sampling): the writer appends consumed spans to
  # spans_staging (cheap) and a background flusher classifies whole traces off
  # the hot path, so the Redis write-queue never backs up to the cap. Validated
  # on staging 2026-07-09. Window/GC use code defaults (90s / 900s).
  SPANBARN_SPAN_STAGING_ENABLED: "1"
  SPANBARN_BUGBARN_ENDPOINT: "https://bugbarn.wiebe.xyz"
  SPANBARN_SELF_ENDPOINT: "http://spanbarn-ingest:8080"
  SPANBARN_REDIS_URL: "redis://spanbarn-redis:6379"
  # Token-bound sessions: how long an OIDC session keeps being served with a
  # stale access token while iambarn refresh fails TRANSIENTLY (network/5xx).
  # invalid_grant never gets grace. SPANBARN_SESSION_TTL_SECONDS (default 12h)
  # remains the absolute session cap.
  SPANBARN_OIDC_REFRESH_GRACE_SECONDS: "3600"
  # SPANBARN_TRUSTED_PROXIES is deliberately unset: outside dev the app then
  # assumes TLS terminates upstream (Secure cookies + HSTS always on) instead
  # of trusting a client-spoofable X-Forwarded-Proto. Set it to the ingress
  # pod CIDRs only if per-request scheme detection is ever needed.
  # SPANBARN_E2E_ENABLED stays unset (off) here; the testing/staging overlays
  # enable it for CI Playwright. Production additionally hard-blocks e2e.
