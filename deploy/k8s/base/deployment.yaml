apiVersion: apps/v1
kind: Deployment
metadata:
  name: spanbarn
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spanbarn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spanbarn
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: spanbarn
          image: ghcr.io/wiebe-xyz/spanbarn/service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: spanbarn-config
            - secretRef:
                name: spanbarn-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: spanbarn-data
              mountPath: /var/lib/spanbarn
      volumes:
        - name: spanbarn-data
          persistentVolumeClaim:
            claimName: spanbarn-data
