# A few days of retention on testing, which only serves CI and short-lived
# checks (webwiebe/k3s-infra#61); production keeps the base values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: spanbarn-config
data:
  SPANBARN_RETENTION_ERROR_DAYS: "3"
  SPANBARN_RETENTION_AGGREGATED_DAYS: "7"
  SPANBARN_RETENTION_INTERESTING_HOURS: "12"
  SPANBARN_METRICS_RETENTION_DAYS: "2"
  SPANBARN_ERROR_LOG_RETENTION_DAYS: "3"
  SPANBARN_PROMPT_RETENTION_DAYS: "3"
  # Rewrite main once in auto_vacuum=INCREMENTAL mode so freed pages go back
  # to the volume (deploy/docs/compact-main.md). A no-op once done.
  SPANBARN_COMPACT_MAIN_ON_START: "true"
