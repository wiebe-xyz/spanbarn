apiVersion: apps/v1
kind: Deployment
metadata:
  name: spanbarn
spec:
  template:
    metadata:
      labels:
        # Opts the writer out of the cluster's Kyverno policies that rewrite
        # requests to cpu 10m / memory 128Mi (k3s-infra#79), so the scheduler
        # sees the real 3Gi. Harmless until the policy exclusion is applied.
        resources.wiebe.xyz/keep-requests: "allow"
    spec:
      containers:
        - name: spanbarn
          # Go sets GOMAXPROCS from the 2-core limit. A write job that reads a
          # cold SQLite page through mmap blocks its thread in a page fault
          # while it keeps one of the two Ps, so during a disk stall every other
          # goroutine (queue consumers, timers, the API) shared the other one:
          # 18 runnable goroutines in the 2026-10-29 00:03 wedge dump. Four Ps
          # leave room for them; the CPU limit still caps what the pod uses.
          env:
            - name: GOMAXPROCS
              value: "4"
          # The writer ran at its 2Gi limit (memory.events max in the hundreds,
          # ~470 GiB of file refaults over 37h): anon memory (Go heap up to
          # GOMEMLIMIT 1GiB plus the 256 MiB SQLite page cache and the
          # read-only caches) left the kernel page cache almost nothing, so
          # index reads went back to disk. 3Gi leaves ~1.5 GiB for page cache.
          # The 500m CPU limit throttled 4.5% of periods (~920 s), which stalls
          # the serial write scheduler; the limit is raised to 2 cores and the
          # request kept low so scheduling is unchanged.
          resources:
            requests:
              cpu: 250m
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 3Gi
