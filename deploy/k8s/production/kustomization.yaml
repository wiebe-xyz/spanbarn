apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spanbarn-production
resources:
  - namespace.yaml
  - ../base
  - ../base/cronjob-settings-snapshot
  - ingress.yaml
  - ingress-forward-domains.yaml
  - middleware-sb-redirect.yaml
  - middleware-otlp-root.yaml
patches:
  # The deploy replaces __VERSION__ (testing/staging: main-<sha7>, production:
  # the release tag). It lives in the pod spec so the pods roll when only the
  # version changes, which happens when a tag is cut on an already-deployed sha.
  - target:
      kind: Deployment
      name: spanbarn
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPANBARN_VERSION
          value: "__VERSION__"
  - target:
      kind: Deployment
      name: spanbarn-ingest
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPANBARN_VERSION
          value: "__VERSION__"
  - path: patch-resources.yaml

# Image tags are injected by the deploy workflow (sed-replaces __SHA__).
# This avoids the ":latest" tag being applied — that tag isn't published.
images:
  - name: ghcr.io/wiebe-xyz/spanbarn/service
    newTag: __SHA__
  - name: ghcr.io/wiebe-xyz/spanbarn/web
    newTag: __SHA__
