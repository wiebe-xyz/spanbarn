apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spanbarn-production
resources:
  - namespace.yaml
  - ../base
  - ingress.yaml
  - ingress-forward-domains.yaml
  - middleware-sb-redirect.yaml
# Image tags are injected by the deploy workflow (sed-replaces __SHA__).
# This avoids the ":latest" tag being applied — that tag isn't published.
patches:
  # Match the PVC that was provisioned with local-path before the
  # spanbarn-local StorageClass was introduced. storageClassName and
  # volumeName are immutable so kubectl apply fails if they differ.
  - path: pvc-patch.yaml

images:
  - name: ghcr.io/wiebe-xyz/spanbarn/service
    newTag: __SHA__
  - name: ghcr.io/wiebe-xyz/spanbarn/web
    newTag: __SHA__
