apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spanbarn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: spanbarn.wiebe.xyz
      http:
        paths:
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: spanbarn-ingest
                port:
                  name: http
          - path: /api/v1/spans
            pathType: Prefix
            backend:
              service:
                name: spanbarn-ingest
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spanbarn
                port:
                  name: http
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: spanbarn
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spanbarn-web
                port:
                  name: http
  tls:
    - hosts:
        - spanbarn.wiebe.xyz
      secretName: spanbarn-wiebe-xyz-tls
