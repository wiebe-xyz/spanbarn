apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spanbarn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  entryPoints:
    - websecure
  routes:
    # Ingest paths — always handled by the ingest pod (it spools to disk and forwards).
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/v1/traces`)
      kind: Rule
      services:
        - name: spanbarn-ingest
          port: 8080
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/spans`)
      kind: Rule
      services:
        - name: spanbarn-ingest
          port: 8080
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/telemetry`)
      kind: Rule
      services:
        - name: spanbarn-ingest
          port: 8080
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/client-errors`)
      kind: Rule
      services:
        - name: spanbarn-ingest
          port: 8080

    # API + OTLP query paths — prefer the writer pod, fail over to the ingest
    # pod (read-only DB) when the writer is unavailable so the dashboard stays
    # alive across writer restarts.
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: spanbarn-failover
          kind: TraefikService
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/v1`)
      kind: Rule
      services:
        - name: spanbarn-failover
          kind: TraefikService

    # Static frontend.
    - match: Host(`spanbarn.wiebe.xyz`)
      kind: Rule
      services:
        - name: spanbarn-web
          port: 8080
  tls:
    secretName: spanbarn-wiebe-xyz-tls
