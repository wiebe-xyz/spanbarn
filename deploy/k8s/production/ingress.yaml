apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: spanbarn
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  entryPoints:
    - websecure
  routes:
    # Ingest paths — always handled by the reader/ingest pod.
    # priority: 101 ensures these beat the generic POST /api rule (priority 100).
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/v1/traces`)
      kind: Rule
      priority: 101
      services:
        - name: spanbarn-ingest
          port: 8080
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/spans`)
      kind: Rule
      priority: 101
      services:
        - name: spanbarn-ingest
          port: 8080
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/telemetry`)
      kind: Rule
      priority: 101
      services:
        - name: spanbarn-ingest
          port: 8080
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/client-errors`)
      kind: Rule
      priority: 101
      services:
        - name: spanbarn-ingest
          port: 8080

    # Mutating API calls must hit the writer. When the writer is down they
    # 503 (no endpoints) — but reads keep flowing via the rule below.
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api`) && (Method(`POST`) || Method(`PUT`) || Method(`PATCH`) || Method(`DELETE`))
      kind: Rule
      priority: 100
      services:
        - name: spanbarn
          port: 8080

    # Setup is GET-but-writes (idempotently creates pending project + setup
    # API key on first visit), so it must hit the writer.
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/setup`)
      kind: Rule
      priority: 100
      services:
        - name: spanbarn
          port: 8080

    # OIDC login/callback/logout write the server-side session row (and the
    # session-refresh POST rotates tokens), so they must hit the writer — the
    # ingest pod mounts the database read-only.
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api/v1/oidc`)
      kind: Rule
      priority: 100
      services:
        - name: spanbarn
          port: 8080

    # Well-known theme manifest served by the Go backend, not the SPA.
    # priority: 101 beats the static frontend catch-all so it doesn't fall
    # through to index.html.
    - match: Host(`spanbarn.wiebe.xyz`) && Path(`/.well-known/iambarn-theme.json`)
      kind: Rule
      priority: 101
      services:
        - name: spanbarn-reads
          port: 8080

    # Reads — load-balanced across writer + ingest pods (both carry
    # spanbarn.io/serves-reads). When the writer is unready during a deploy,
    # k8s drops it from this Service's endpoints and the ingest pod (read-only
    # DB) keeps serving the dashboard.
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: spanbarn-reads
          port: 8080
    - match: Host(`spanbarn.wiebe.xyz`) && PathPrefix(`/v1`)
      kind: Rule
      services:
        - name: spanbarn-reads
          port: 8080

    # Static frontend.
    - match: Host(`spanbarn.wiebe.xyz`)
      kind: Rule
      services:
        - name: spanbarn-web
          port: 8080
  tls:
    secretName: spanbarn-wiebe-xyz-tls
---
# sb.bananasketch.nl — custom domain alias for SpanBarn.
# Uses a standard Ingress (not IngressRoute) so cert-manager can issue a
# separate TLS cert. Method-based write/read split is not needed here;
# all ingest and API paths are functional without it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spanbarn-bananasketch-nl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: sb.bananasketch.nl
      http:
        paths:
          - path: /v1/traces
            pathType: Prefix
            backend:
              service:
                name: spanbarn-ingest
                port:
                  name: http
          - path: /api/v1/spans
            pathType: Prefix
            backend:
              service:
                name: spanbarn-ingest
                port:
                  name: http
          - path: /api/v1/telemetry
            pathType: Prefix
            backend:
              service:
                name: spanbarn-ingest
                port:
                  name: http
          - path: /api/v1/client-errors
            pathType: Prefix
            backend:
              service:
                name: spanbarn-ingest
                port:
                  name: http
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: spanbarn-reads
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: spanbarn
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spanbarn-web
                port:
                  name: http
  tls:
    - hosts:
        - sb.bananasketch.nl
      secretName: sb-bananasketch-nl-tls
