name: Binary Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next_version.outputs.version }}
      version_num: ${{ steps.next_version.outputs.version_num }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v*' --sort=-version:refname | head -1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next_version
        run: |
          LATEST_TAG=${{ steps.latest_tag.outputs.tag }}
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          NEW_VERSION=${{ steps.next_version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${NEW_VERSION}" -m "Release ${NEW_VERSION}"
          git push origin "${NEW_VERSION}"

  publish-npm:
    needs: [tag]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: sdks/js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    needs: [tag]
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install build twine
      - run: python -m build
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  build-debs:
    name: Build .deb Packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: tag
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install nfpm
        # Pin nfpm (not @latest) so a new release bumping its Go requirement
        # can't break the .deb build out from under us. v2.47.0 needs Go >= 1.26.4.
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build binary
        env:
          GOOS: linux
          VERSION: ${{ needs.tag.outputs.version_num }}
        run: |
          GOARCH="${{ matrix.arch }}"
          export GOARCH
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.Version=v${VERSION} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p dist
          go build -ldflags "${LDFLAGS}" -o dist/spanbarn-linux-${GOARCH} ./cmd/spanbarn
          go build -ldflags "${LDFLAGS}" -o dist/sb-linux-${GOARCH} ./cmd/sb

      - name: Build .deb packages
        env:
          VERSION: ${{ needs.tag.outputs.version_num }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p debs
          envsubst < nfpm-spanbarn.yaml > nfpm-spanbarn-processed.yaml
          nfpm package \
            --config nfpm-spanbarn-processed.yaml \
            --packager deb \
            --target debs/
          envsubst < nfpm-sb.yaml > nfpm-sb-processed.yaml
          nfpm package \
            --config nfpm-sb-processed.yaml \
            --packager deb \
            --target debs/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
          retention-days: 30

  build-darwin-tarballs:
    name: Build macOS Tarballs (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: tag
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Build macOS binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.tag.outputs.version_num }}
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.Version=v${VERSION} -X main.BuildTime=${BUILD_TIME}"
          mkdir -p dist
          go build -ldflags "${LDFLAGS}" -o dist/spanbarn ./cmd/spanbarn
          go build -ldflags "${LDFLAGS}" -o dist/sb ./cmd/sb
          TARBALL="spanbarn-darwin-${{ matrix.arch }}-${VERSION}.tar.gz"
          tar -czvf dist/${TARBALL} -C dist spanbarn
          SB_TARBALL="sb-darwin-${{ matrix.arch }}-${VERSION}.tar.gz"
          tar -czvf dist/${SB_TARBALL} -C dist sb
          rm dist/spanbarn dist/sb

      - name: Generate checksums
        run: |
          cd dist
          for f in *.tar.gz; do sha256sum "$f" > "${f}.sha256"; done

      - name: Upload tarball artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.arch }}
          path: dist/*.tar.gz*
          retention-days: 30

  attach-to-release:
    name: Attach Artifacts to Release
    runs-on: ubuntu-latest
    needs: [tag, build-debs, build-darwin-tarballs]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.deb" -exec cp {} release/ \;
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find artifacts -name "*.sha256" -exec cp {} release/ \;
          cd release && sha256sum *.deb > checksums-deb.txt 2>/dev/null || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger rapid-root APT repository update
        env:
          GH_TOKEN: ${{ secrets.RAPID_ROOT_DISPATCH_TOKEN }}
        run: |
          gh api repos/wiebe-xyz/rapid-root/dispatches \
            --method POST \
            --field event_type=apt-package-update \
            --field 'client_payload[repo]=wiebe-xyz/spanbarn' \
            --field 'client_payload[tag]=${{ needs.tag.outputs.version }}' \
            --field 'client_payload[asset_pattern]=*.deb'

  # ---------------------------------------------------------------------------
  # Homebrew: publish the `sb` CLI tarball + formula.
  #
  # The server is deployed via k8s, so only the CLI is brewed. Credentials are
  # decrypted on disk from deploy/ci-secrets.yaml (SOPS + age) using the
  # SOPS_AGE_KEY_PRODUCTION repo secret — the same mechanism as the deploy
  # workflows. No MinIO/tap GitHub Actions secrets are required.
  #   ci-secrets.yaml provides: minio.{access_key,secret_key,endpoint,bucket}
  #                             github.release_tag_pat (push to the tap)
  # Tap repo: webwiebe/homebrew-spanbarn. Tarballs served from
  # https://webwiebe.nl/brew/ (MinIO brew/ prefix).
  # ---------------------------------------------------------------------------
  update-brew-repo:
    name: Update Homebrew Tarballs (MinIO)
    runs-on: ubuntu-latest
    needs: [tag, build-darwin-tarballs]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download darwin artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: darwin-*
          path: darwin-download

      - name: Install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Prepare brew repository
        env:
          VERSION: ${{ needs.tag.outputs.version_num }}
        run: |
          mkdir -p brew-repo/Formula
          find darwin-download -name "sb-darwin-*.tar.gz" -exec cp {} brew-repo/ \;
          find darwin-download -name "sb-darwin-*.tar.gz.sha256" -exec cp {} brew-repo/ \;

          AMD64_SHA=$(awk '{print $1}' brew-repo/sb-darwin-amd64-${VERSION}.tar.gz.sha256)
          ARM64_SHA=$(awk '{print $1}' brew-repo/sb-darwin-arm64-${VERSION}.tar.gz.sha256)

          cat > brew-repo/Formula/sb.rb << EOF
          class Sb < Formula
            desc "SpanBarn CLI — query traces, logs, metrics and prompt samples"
            homepage "https://github.com/wiebe-xyz/spanbarn"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://webwiebe.nl/brew/sb-darwin-amd64-${VERSION}.tar.gz"
                sha256 "${AMD64_SHA}"
              elsif Hardware::CPU.arm?
                url "https://webwiebe.nl/brew/sb-darwin-arm64-${VERSION}.tar.gz"
                sha256 "${ARM64_SHA}"
              end
            end

            def install
              bin.install "sb"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sb version")
            end
          end
          EOF

      - name: Deploy to MinIO (brew/ prefix — only adds sb files)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          pip install awscli
          # Decrypt MinIO credentials on disk (never echoed).
          export AWS_ACCESS_KEY_ID=$(sops -d --extract '["minio"]["access_key"]' deploy/ci-secrets.yaml)
          export AWS_SECRET_ACCESS_KEY=$(sops -d --extract '["minio"]["secret_key"]' deploy/ci-secrets.yaml)
          AWS_ENDPOINT_URL=$(sops -d --extract '["minio"]["endpoint"]' deploy/ci-secrets.yaml)
          MINIO_BUCKET=$(sops -d --extract '["minio"]["bucket"]' deploy/ci-secrets.yaml)
          # cp per-file (not sync) to avoid the LIST timeout against MinIO; we
          # only ever upload, never delete other apps' files in the bucket.
          find brew-repo -type f | while read -r f; do
            key="${f#brew-repo/}"
            aws --endpoint-url "$AWS_ENDPOINT_URL" s3 cp \
              "$f" \
              "s3://${MINIO_BUCKET}/brew/${key}" \
              --cache-control "public, max-age=3600, must-revalidate"
          done

  update-homebrew-tap:
    name: Update Homebrew Tap (GitHub)
    runs-on: ubuntu-latest
    needs: [tag, update-brew-repo]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download darwin artifacts for checksums
        uses: actions/download-artifact@v8
        with:
          pattern: darwin-*
          path: darwin-download

      - name: Install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.12.2/sops-v3.12.2.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Generate formula and push to tap
        env:
          VERSION: ${{ needs.tag.outputs.version_num }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          TAP_GITHUB_TOKEN=$(sops -d --extract '["github"]["release_tag_pat"]' deploy/ci-secrets.yaml)

          AMD64_SHA=$(awk '{print $1}' darwin-download/darwin-amd64/sb-darwin-amd64-${VERSION}.tar.gz.sha256)
          ARM64_SHA=$(awk '{print $1}' darwin-download/darwin-arm64/sb-darwin-arm64-${VERSION}.tar.gz.sha256)

          git clone https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/webwiebe/homebrew-spanbarn.git tap-repo
          cd tap-repo
          mkdir -p Formula

          cat > Formula/sb.rb << EOF
          class Sb < Formula
            desc "SpanBarn CLI — query traces, logs, metrics and prompt samples"
            homepage "https://github.com/wiebe-xyz/spanbarn"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://webwiebe.nl/brew/sb-darwin-amd64-${VERSION}.tar.gz"
                sha256 "${AMD64_SHA}"
              elsif Hardware::CPU.arm?
                url "https://webwiebe.nl/brew/sb-darwin-arm64-${VERSION}.tar.gz"
                sha256 "${ARM64_SHA}"
              end
            end

            def install
              bin.install "sb"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sb version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/sb.rb
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update sb formula to ${VERSION}"
            git push
          fi
