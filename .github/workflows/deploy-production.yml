name: Deploy Production

# Production rolls forward on its own once "Build and Deploy Testing" succeeded
# for a main commit. That workflow deploys testing and staging and runs the E2E
# gate, so a success means staging rolled out. The release tag for the same
# commit is created by Binary Release; preflight waits for it. A manual dispatch
# still deploys any version that is already on staging.
on:
  workflow_run:
    workflows: ["Build and Deploy Testing"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      production_version:
        description: 'Version to deploy (e.g. v0.1.0) — must already be on staging'
        required: true
        type: string
      confirmed:
        description: 'I confirm this version is validated on staging'
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SERVICE_IMAGE: ghcr.io/wiebe-xyz/spanbarn/service
  WEB_IMAGE: ghcr.io/wiebe-xyz/spanbarn/web
  K3S_HOST: layer7.wiebe.xyz
  K3S_USER: deployer
  NAMESPACE: spanbarn-production

jobs:
  preflight:
    runs-on: [self-hosted, build]
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Require confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirmed }}" != "true" ]; then
            echo "ERROR: Set 'confirmed' to true to proceed with production deploy"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version tag to SHA and verify images in GHCR
        id: resolve
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.production_version }}"
          if [ -z "${VERSION}" ]; then
            # Automatic run: the tag Binary Release put on the tested commit.
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            for i in $(seq 1 40); do
              git fetch --tags --force -q
              VERSION=$(git tag --points-at "${HEAD_SHA}" -l 'v*' --sort=-version:refname | head -1)
              [ -n "${VERSION}" ] && break
              echo "No release tag on ${HEAD_SHA} yet (${i}/40)"
              sleep 15
            done
            [ -n "${VERSION}" ] || { echo "ERROR: no release tag appeared for ${HEAD_SHA}"; exit 1; }
          fi
          SHA=$(git rev-list -n1 "${VERSION}" 2>/dev/null) || \
            { echo "ERROR: Tag ${VERSION} not found in repo"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${VERSION} -> ${SHA}"
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$DOCKER_CONFIG_DIR/config.json"
          export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
          docker manifest inspect "${SERVICE_IMAGE}:${SHA}" > /dev/null || \
            { echo "ERROR: ${SERVICE_IMAGE}:${SHA} not found in GHCR (for ${VERSION})"; exit 1; }
          docker manifest inspect "${WEB_IMAGE}:${SHA}" > /dev/null || \
            { echo "ERROR: ${WEB_IMAGE}:${SHA} not found in GHCR (for ${VERSION})"; exit 1; }
          echo "Images verified for ${VERSION} (${SHA})"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    runs-on: [self-hosted, build]
    # Apply plus smoke can take about 30 minutes; a rollback after a late
    # failure needs the same again.
    timeout-minutes: 60
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v6

      - name: Transfer manifests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "rm -rf /tmp/spanbarn-deploy && mkdir -p /tmp/spanbarn-deploy"
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -r deploy \
            "${K3S_USER}@${K3S_HOST}:/tmp/spanbarn-deploy/deploy"

      - name: Record the running release
        id: record
        run: |
          set -euo pipefail
          # Every Deployment's revision and every CronJob image, so a failed
          # deploy can put each one back where it was.
          STATE="/tmp/spanbarn-release-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "sh /tmp/spanbarn-deploy/deploy/scripts/release-state.sh record ${NAMESPACE} ${STATE}"
          echo "state=${STATE}" >> "$GITHUB_OUTPUT"
          # The release prod serves now, to smoke after a rollback. Prod being
          # down already does not block the deploy that may fix it.
          if PREV="$(curl -fsS --max-time 15 https://spanbarn.wiebe.xyz/api/v1/version)"; then
            echo "prev_version=$(printf '%s' "$PREV" | sed -nE 's/.*"version":"([^"]+)".*/\1/p')" >> "$GITHUB_OUTPUT"
            echo "prev_commit=$(printf '%s' "$PREV" | sed -nE 's/.*"commit":"([^"]+)".*/\1/p')" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::production /api/v1/version did not answer; a rollback would not be smoked"
          fi

      - name: Ensure namespace exists
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f /tmp/spanbarn-deploy/deploy/k8s/production/namespace.yaml"

      - name: Decrypt and apply secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_PRODUCTION }}
        run: |
          set -euo pipefail
          sops -d deploy/k8s/production/secret.yaml | \
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f -"

      - name: Create GHCR pull secret
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" "
            kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='webwiebe' \
              --docker-password='${{ secrets.GHCR_PULL_PAT }}' \
              --namespace=${NAMESPACE} \
              --dry-run=client -o yaml | kubectl apply -f -
          "

      - name: Apply manifests and roll out
        id: apply
        run: |
          set -euo pipefail
          SHA="${{ needs.preflight.outputs.sha }}"
          # Inject the resolved SHA into the kustomization images: transform so
          # the deployment carries an existing tag in a single rollout (no
          # transient ":latest" — that tag isn't published).
          sed -i.bak "s/__SHA__/${SHA}/g" deploy/k8s/production/kustomization.yaml
          # The pods report the release tag as their version (GET /api/v1/version).
          VERSION="${{ needs.preflight.outputs.version }}"
          sed -i.bak "s/__VERSION__/${VERSION}/g" deploy/k8s/production/kustomization.yaml
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            deploy/k8s/production/kustomization.yaml \
            "${K3S_USER}@${K3S_HOST}:/tmp/spanbarn-deploy/deploy/k8s/production/kustomization.yaml"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" "
            set -euo pipefail
            kubectl -n ${NAMESPACE} delete ingress.networking.k8s.io/spanbarn --ignore-not-found
            kubectl apply -k /tmp/spanbarn-deploy/deploy/k8s/production
            # The writer is Ready only once its API is wired. A one-time spans
            # cut-over runs before that and took about 7 minutes on prod's data.
            kubectl -n ${NAMESPACE} rollout status deployment/spanbarn --timeout=1200s
            kubectl -n ${NAMESPACE} rollout status deployment/spanbarn-ingest --timeout=360s
            kubectl -n ${NAMESPACE} rollout status deployment/spanbarn-web --timeout=360s
            # Smoke: the pods report the released tag at the tag's commit. A
            # failure triggers the rollback step below.
            sh /tmp/spanbarn-deploy/deploy/scripts/assert-version.sh ${NAMESPACE} spanbarn spanbarn ${VERSION} ${SHA}
            sh /tmp/spanbarn-deploy/deploy/scripts/assert-version.sh ${NAMESPACE} spanbarn-ingest spanbarn-ingest ${VERSION} ${SHA}
          "

      - name: Smoke production through its public hostname
        run: bash scripts/smoke.sh https://spanbarn.wiebe.xyz "${{ needs.preflight.outputs.version }}" "${{ needs.preflight.outputs.sha }}"

      - name: Roll back to the recorded release
        if: failure() && steps.record.outcome == 'success'
        env:
          STATE: ${{ steps.record.outputs.state }}
          PREV_VERSION: ${{ steps.record.outputs.prev_version }}
          PREV_COMMIT: ${{ steps.record.outputs.prev_commit }}
        run: |
          set -euo pipefail
          # Undo each Deployment to its recorded revision and reset each CronJob
          # image. restore exits non-zero when any workload cannot be put back,
          # so a rollback that did not finish fails this step.
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "sh /tmp/spanbarn-deploy/deploy/scripts/release-state.sh restore ${NAMESPACE} ${STATE}"
          if [ -n "${PREV_VERSION}" ] && [ -n "${PREV_COMMIT}" ]; then
            bash scripts/smoke.sh https://spanbarn.wiebe.xyz "${PREV_VERSION}" "${PREV_COMMIT}"
          else
            echo "::warning::no previous version was recorded; the rollback is not smoked"
          fi

      - name: Post release marker to BugBarn
        if: vars.BUGBARN_ENDPOINT != ''
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.SPANBARN_BUGBARN_API_KEY }}
        run: |
          curl -sf -X POST "${BUGBARN_ENDPOINT}/api/v1/releases" \
            -H "Content-Type: application/json" \
            -H "X-BugBarn-Api-Key: ${BUGBARN_API_KEY}" \
            -d "{
              \"name\": \"${{ needs.preflight.outputs.version }}\",
              \"environment\": \"production\",
              \"version\": \"${{ needs.preflight.outputs.version }}\",
              \"url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${{ needs.preflight.outputs.version }}\",
              \"notes\": \"Deployed by GitHub Actions run #${GITHUB_RUN_NUMBER}\"
            }" || echo "BugBarn release marker skipped"

      - name: Summary
        run: |
          echo "## Production Deploy Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.preflight.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | https://spanbarn.wiebe.xyz |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | \`${NAMESPACE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | \`${K3S_HOST}\` |" >> "$GITHUB_STEP_SUMMARY"
