name: Build and Deploy Testing

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push waits for the running deploy instead of cancelling it. With
# cancel-in-progress, each merge cancelled the testing and staging rollout of
# the merge before it, and with it the production deploy that runs when this
# workflow succeeds, so a busy hour of merges reached production late or not
# at all (65cb243 on 2026-10-29). GitHub keeps one pending run per group and
# replaces it with the newest, which contains every commit before it.
concurrency:
  group: deploy-testing
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SERVICE_IMAGE: ghcr.io/wiebe-xyz/spanbarn/service
  WEB_IMAGE: ghcr.io/wiebe-xyz/spanbarn/web
  K3S_HOST: k3s1.nijmegen.wiebe.xyz
  K3S_USER: root
  NAMESPACE: spanbarn-testing

jobs:
  build:
    runs-on: [self-hosted, build]
    timeout-minutes: 30
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build and push images
        run: |
          set -euo pipefail
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$DOCKER_CONFIG_DIR/config.json"
          export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --build-arg VERSION="${{ github.sha }}" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f deploy/docker/service.Dockerfile \
            -t "${SERVICE_IMAGE}:${{ github.sha }}" \
            .
          docker buildx build \
            --platform linux/amd64 \
            --push \
            -f deploy/docker/web.Dockerfile \
            -t "${WEB_IMAGE}:${{ github.sha }}" \
            .

  test:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Isolate the Go module cache
        # setup-go's cache tars GOMODCACHE and the shared GOCACHE (43 GB on the
        # runner host) into the Actions cache and back, 10 to 25 minutes per
        # job, on runners where the build cache stays on disk anyway. The
        # module cache is per job for the cross-repo race described in ci.yml.
        shell: bash
        run: echo "GOMODCACHE=${RUNNER_TEMP}/gomodcache" >> "$GITHUB_ENV"

      - name: Run Go tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out

  quality-backend:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Isolate the Go module cache
        # setup-go's cache tars GOMODCACHE and the shared GOCACHE (43 GB on the
        # runner host) into the Actions cache and back, 10 to 25 minutes per
        # job, on runners where the build cache stays on disk anyway. The
        # module cache is per job for the cross-repo race described in ci.yml.
        shell: bash
        run: echo "GOMODCACHE=${RUNNER_TEMP}/gomodcache" >> "$GITHUB_ENV"
      - name: staticcheck
        # Pinned, not @latest. This is the repo's only dead-code gate; a new
        # staticcheck release would otherwise change what CI enforces with no
        # commit on our side, which is the drift the adjacent gocyclo/dupl/ruff
        # pins exist to prevent. The pin lives in scripts/staticcheck-gate.py,
        # which also fails when U1000 analysed fewer packages than its floor.
        run: python3 scripts/staticcheck-gate.py .
      - name: go vet
        run: go vet ./...
      - name: Go tests with race detector
        # internal/repository is split into shards; see the script header.
        run: bash scripts/race-test.sh
      - name: Ensure kustomize
        # infracheck renders the kustomize overlays. It exits non-zero when
        # neither kustomize nor kubectl is present rather than reporting a clean
        # render, so make sure one of them is there — pinned, not whatever the
        # host happens to carry.
        shell: bash
        run: |
          set -euo pipefail
          if command -v kustomize >/dev/null 2>&1 || command -v kubectl >/dev/null 2>&1; then
            echo "kustomize/kubectl already on PATH"
            exit 0
          fi
          KUSTOMIZE_VERSION=v5.8.1
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64)  PLAT=darwin_arm64 ;;
            Darwin-*)      PLAT=darwin_amd64 ;;
            Linux-aarch64) PLAT=linux_arm64 ;;
            *)             PLAT=linux_amd64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 --retry-delay 3 \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_${PLAT}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          chmod +x "$RUNNER_TEMP/bin/kustomize"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Gate script tests
        run: |
          bash scripts/quality-lib.test.sh
          bash scripts/e2e-targets.test.sh
          go test ./scripts/...
      - name: Quality gate
        # This replaces an inline 60% coverage floor that sat over packages
        # measuring 80.5% and 71.1% — twenty points of slack, so it could never
        # fire, and it was the only coverage check anywhere in the deploy path.
        # scripts/quality-gate.sh enforces the real floors plus complexity, file
        # length and duplication, and now blocks a rollout rather than only a
        # `quality` job that no deploy job depends on.
        run: bash scripts/quality-gate.sh

  frontend-lint:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
      - name: Set up pnpm
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/scripts/use-pnpm.sh"
          echo "$GITHUB_WORKSPACE/.tools/corepack-bin" >> "$GITHUB_PATH"
          if [ -d "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" ]; then echo "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" >> "$GITHUB_PATH"; fi
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm -r --if-present run typecheck
      - name: oxlint ratchet test
        run: pnpm --filter @spanbarn/web lint:ratchet-test
      - name: oxlint
        run: pnpm --filter @spanbarn/web lint

  frontend-test:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspace (clear read-only Go cache from prior runs)
        shell: bash
        # Only this job's own checkout: never another runner's work directory.
        run: |
          c="${GITHUB_WORKSPACE:?}/.cache"
          if [ -d "$c" ]; then
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          fi
      - uses: actions/checkout@v6
      - name: Set up pnpm
        shell: bash
        run: |
          . "$GITHUB_WORKSPACE/scripts/use-pnpm.sh"
          echo "$GITHUB_WORKSPACE/.tools/corepack-bin" >> "$GITHUB_PATH"
          if [ -d "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" ]; then echo "$GITHUB_WORKSPACE/.tools/corepack/node_modules/.bin" >> "$GITHUB_PATH"; fi
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest
        # The runners share one host with every other repo's CI. vitest's
        # default of one fork per core let worker start-up time out (60s,
        # hardcoded in vitest) when the host was at 0% idle (run 38996476179).
        env:
          VITEST_MAX_WORKERS: '2'
        run: pnpm --filter @spanbarn/web test

  deploy:
    needs: [build, test, quality-backend, frontend-lint, frontend-test]
    runs-on: [self-hosted, build]
    timeout-minutes: 15
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v6

      - name: Transfer manifests
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "rm -rf /tmp/spanbarn-deploy && mkdir -p /tmp/spanbarn-deploy"
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -r deploy \
            "${K3S_USER}@${K3S_HOST}:/tmp/spanbarn-deploy/deploy"

      - name: Ensure namespace exists
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f /tmp/spanbarn-deploy/deploy/k8s/testing/namespace.yaml"

      - name: Decrypt and apply secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_TESTING }}
        run: |
          set -euo pipefail
          sops -d deploy/k8s/testing/secret.yaml | \
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f -"

      - name: Create GHCR pull secret
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" "
            kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='webwiebe' \
              --docker-password='${{ secrets.GHCR_PULL_PAT }}' \
              --namespace=${NAMESPACE} \
              --dry-run=client -o yaml | kubectl apply -f -
          "

      - name: Apply manifests and roll out
        run: |
          set -euo pipefail
          # Inject the commit SHA into the kustomization images: transform
          # so the deployment spec carries an existing tag in one shot
          # (no transient ":latest" rollout).
          sed -i.bak "s/__SHA__/${{ github.sha }}/g" deploy/k8s/testing/kustomization.yaml
          # The pods report this as their version (GET /api/v1/version).
          VERSION="main-${GITHUB_SHA:0:7}"
          sed -i.bak "s/__VERSION__/${VERSION}/g" deploy/k8s/testing/kustomization.yaml
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            deploy/k8s/testing/kustomization.yaml \
            "${K3S_USER}@${K3S_HOST}:/tmp/spanbarn-deploy/deploy/k8s/testing/kustomization.yaml"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" "
            set -euo pipefail
            kubectl -n ${NAMESPACE} delete ingress.networking.k8s.io/spanbarn --ignore-not-found
            kubectl apply -k /tmp/spanbarn-deploy/deploy/k8s/testing
            kubectl -n ${NAMESPACE} rollout status deployment/spanbarn --timeout=360s
            kubectl -n ${NAMESPACE} rollout status deployment/spanbarn-ingest --timeout=360s
            kubectl -n ${NAMESPACE} rollout status deployment/spanbarn-web --timeout=360s
            # Smoke: the pods report the version and commit that were deployed.
            sh /tmp/spanbarn-deploy/deploy/scripts/assert-version.sh ${NAMESPACE} spanbarn spanbarn ${VERSION} ${GITHUB_SHA}
            sh /tmp/spanbarn-deploy/deploy/scripts/assert-version.sh ${NAMESPACE} spanbarn-ingest spanbarn-ingest ${VERSION} ${GITHUB_SHA}
          "

      - name: Post release marker to BugBarn
        if: vars.BUGBARN_ENDPOINT != ''
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.SPANBARN_BUGBARN_API_KEY }}
        run: |
          curl -sf -X POST "${BUGBARN_ENDPOINT}/api/v1/releases" \
            -H "Content-Type: application/json" \
            -H "X-BugBarn-Api-Key: ${BUGBARN_API_KEY}" \
            -d "{
              \"name\": \"${GITHUB_SHA:0:7}\",
              \"environment\": \"testing\",
              \"version\": \"${GITHUB_SHA}\",
              \"url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\",
              \"notes\": \"Deployed by GitHub Actions run #${GITHUB_RUN_NUMBER}\"
            }" || echo "BugBarn release marker skipped"

  deploy-staging:
    needs: deploy
    runs-on: [self-hosted, build]
    timeout-minutes: 45
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history and tags: the E2E gate diffs against the last tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Transfer manifests
        run: |
          set -euo pipefail
          # The pods report this as their version (GET /api/v1/version).
          sed -i.bak "s/__VERSION__/main-${GITHUB_SHA:0:7}/g" deploy/k8s/staging/kustomization.yaml
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "rm -rf /tmp/spanbarn-deploy-staging && mkdir -p /tmp/spanbarn-deploy-staging"
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -r deploy \
            "${K3S_USER}@${K3S_HOST}:/tmp/spanbarn-deploy-staging/deploy"

      - name: Ensure namespace exists
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f /tmp/spanbarn-deploy-staging/deploy/k8s/staging/namespace.yaml"

      - name: Decrypt and apply secret
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_STAGING }}
        run: |
          set -euo pipefail
          sops -d deploy/k8s/staging/secret.yaml | \
            ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" \
            "kubectl apply -f -"

      - name: Create GHCR pull secret
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" "
            kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username='webwiebe' \
              --docker-password='${{ secrets.GHCR_PULL_PAT }}' \
              --namespace=spanbarn-staging \
              --dry-run=client -o yaml | kubectl apply -f -
          "

      - name: Apply manifests and roll out
        run: |
          set -euo pipefail
          VERSION="main-${GITHUB_SHA:0:7}"
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "${K3S_USER}@${K3S_HOST}" "
            set -euo pipefail
            kubectl apply -k /tmp/spanbarn-deploy-staging/deploy/k8s/staging
            kubectl -n spanbarn-staging set image deployment/spanbarn \
              spanbarn=${SERVICE_IMAGE}:${{ github.sha }}
            kubectl -n spanbarn-staging set image deployment/spanbarn-ingest \
              spanbarn-ingest=${SERVICE_IMAGE}:${{ github.sha }}
            kubectl -n spanbarn-staging set image deployment/spanbarn-web \
              spanbarn-web=${WEB_IMAGE}:${{ github.sha }}
            kubectl -n spanbarn-staging rollout status deployment/spanbarn --timeout=360s
            kubectl -n spanbarn-staging rollout status deployment/spanbarn-web --timeout=360s
            # The ingest writer is checked as strictly as the other two. It used
            # to end in '|| true' (7ddd3ce) because k3s1 is contended and ingest
            # sometimes needed longer than 360s to schedule onto its local-path
            # PVC. The cost of that was staging reporting success with the
            # writer never ready, and the E2E suite in the next job running
            # against it — a real outage and a slow scheduler produced the same
            # green tick. The fix for 'sometimes needs longer' is a longer
            # timeout, not a suppressed exit code.
            if ! kubectl -n spanbarn-staging rollout status deployment/spanbarn-ingest --timeout=900s; then
              echo '::error::staging ingest rollout did not become ready'
              # Diagnostics only. Their exit codes are deliberately ignored so a
              # missing object cannot mask the failure above; the 'exit 1' is
              # what decides the job.
              kubectl -n spanbarn-staging describe deployment/spanbarn-ingest || true
              kubectl -n spanbarn-staging get pods -l app=spanbarn-ingest -o wide || true
              kubectl -n spanbarn-staging get events --sort-by=.lastTimestamp | tail -40 || true
              exit 1
            fi
            # Smoke: the pods report the version and commit that were deployed.
            sh /tmp/spanbarn-deploy-staging/deploy/scripts/assert-version.sh spanbarn-staging spanbarn spanbarn ${VERSION} ${GITHUB_SHA}
            sh /tmp/spanbarn-deploy-staging/deploy/scripts/assert-version.sh spanbarn-staging spanbarn-ingest spanbarn-ingest ${VERSION} ${GITHUB_SHA}
          "

      # assert-version.sh reads each pod from inside the cluster. This reads
      # the public hostname, through the ingress, as a user would: health and
      # version report this commit, the authenticated API refuses a request
      # without a session with exactly 401, and the page and its bundle load.
      - name: Smoke staging through its public hostname
        run: bash scripts/smoke.sh https://spanbarn.staging.wiebe.xyz "main-${GITHUB_SHA:0:7}" "${GITHUB_SHA}"

      - name: Post release marker to BugBarn
        if: vars.BUGBARN_ENDPOINT != ''
        env:
          BUGBARN_ENDPOINT: ${{ vars.BUGBARN_ENDPOINT }}
          BUGBARN_API_KEY: ${{ secrets.SPANBARN_BUGBARN_API_KEY }}
        run: |
          curl -sf -X POST "${BUGBARN_ENDPOINT}/api/v1/releases" \
            -H "Content-Type: application/json" \
            -H "X-BugBarn-Api-Key: ${BUGBARN_API_KEY}" \
            -d "{
              \"name\": \"${GITHUB_SHA:0:7}\",
              \"environment\": \"staging\",
              \"version\": \"${GITHUB_SHA}\",
              \"url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\",
              \"notes\": \"Deployed by GitHub Actions run #${GITHUB_RUN_NUMBER}\"
            }" || echo "BugBarn release marker skipped"

      - name: Wait for staging writer API to initialize
        run: |
          set -euo pipefail
          STAGING_URL=https://spanbarn.staging.wiebe.xyz
          echo "Waiting for staging writer API to finish initializing (migrations may take a while)..."
          # The route sits behind ingest auth, so a wired writer refuses the
          # probe bearer with exactly 401. 404 means the API is not wired yet;
          # a 5xx or no answer is not ready either. Before, anything but 404
          # and 000 passed, so a 502 from the ingress counted as ready.
          STATUS=000
          for i in $(seq 1 180); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -X POST \
              "${STAGING_URL}/api/v1/e2e/session" \
              -H "Authorization: Bearer probe" 2>/dev/null) || STATUS=000
            if [ "$STATUS" = "401" ]; then
              echo "Writer API ready (HTTP ${STATUS})"
              exit 0
            fi
            echo "Not ready yet, attempt ${i}/180 (HTTP ${STATUS})"
            sleep 10
          done
          echo "::error::writer API not ready after 180 attempts, last HTTP ${STATUS}"
          exit 1

      # The full suite runs nightly (e2e-nightly.yml). This gate runs only the
      # specs mapped from the paths changed since the last tag, and none for a
      # docs-only change.
      - name: Pick E2E specs for this change
        id: targets
        run: |
          set -euo pipefail
          specs=$(scripts/e2e-targets.sh)
          echo "Specs for this change:"
          echo "${specs:-<none>}"
          if [ -n "$specs" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo 'specs<<E2E_SPECS_EOF'
            echo "$specs"
            echo 'E2E_SPECS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run targeted E2E specs against staging
        if: steps.targets.outputs.run == 'true'
        uses: ./.github/actions/e2e-staging
        with:
          specs: ${{ steps.targets.outputs.specs }}
          sops-age-key: ${{ secrets.SOPS_AGE_KEY_STAGING }}
